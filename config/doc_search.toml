# Config for `tasks.doc_index` / `tasks.doc_search`. All keys optional --
# omit the file entirely to get the defaults shown here.

# Directories to scan, recursively. `~` is expanded.
roots = ["~/Documents"]

# Directory names skipped anywhere under a root (case-insensitive), plus
# anything starting with "." (hidden dirs are always skipped).
exclude_dirs = ["GitHub"]
