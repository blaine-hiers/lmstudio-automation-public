# --- vision model -------------------------------------------------------------

# These also make text (extract) calls; the dispatcher points them at the
# vision model (LMSA_CHAT_MODEL override) so only one model is ever resident.
[tasks.attachments]
cadence = "daily 03:00"
deadline_hours = 12
model = "vision"

[tasks.file_sorter]        # dry-run by default: proposes moves, moves nothing
cadence = "daily 03:10"
deadline_hours = 12
model = "vision"

[tasks.doc_inbox]          # dry-run by default: proposes filing, moves nothing
cadence = "daily 03:20"
deadline_hours = 12
model = "vision"

[tasks.photo_index]        # #64: read-only; captions new/changed photos, capped per run
cadence = "weekly sun 03:30"
deadline_hours = 48
model = "vision"
timeout_minutes = 120

# Not scheduled on purpose: ask, doc_search (interactive), shootout (loads
# every model), gmail_probe, style_preview, index (diagnostics/manual).

# --- voice memos (#62) ----------------------------------------------------------

# Phase 1 (whisper): transcribe new recordings. Phase 2 (chat): summarize them.
# Two entries so whisper and the chat model are never resident together; the
# dispatcher always runs the whisper batch before the chat batch.
[tasks.voice_transcribe]
cadence = "daily 01:25"
deadline_hours = 12
model = "whisper"
timeout_minutes = 120

[tasks.voice_memos]
cadence = "daily 01:30"
deadline_hours = 12
model = "chat"

# --- briefings (#52) ----------------------------------------------------------
# One entry for every config/briefings/*.toml: with no --name the task runs each
# briefing whose file says `enabled = true` and whose last successful run is at
# least its `every_hours` old (default 20). A briefing that wants to run more
# often than daily needs this cadence raised too (e.g. "every 6 hours").
[tasks.briefing]
cadence = "daily 04:30"
deadline_hours = 6
model = "chat"
timeout_minutes = 120

# --- site watch (#53) ----------------------------------------------------------
# config/site_watch.toml: fetch, diff and judge each watched page once a day.
[tasks.site_watch]
cadence = "daily 03:10"
deadline_hours = 6
model = "chat"
